<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <link rel="stylesheet" href="citas.css">
</head>
<body>
    <header class="header">
        <h1>CLÍNICA PSICOLÓGICA</h1>
       <a href="MenuP.html"> <button class="back-button" onclick="window.history.back()">Regresar</button></a>
    </header>
    <main class="main-container">
        <section class="calendar-section">
            <div class="calendar-header">
                <!-- Botones de navegación de meses -->
                <button class="nav-button" id="prev-month">&lt;</button>
                <h2 id="month-display"></h2>
                <button class="nav-button" id="next-month">&gt;</button>
            </div>
            <!-- Calendario dinámico -->
            <div class="calendar-grid" id="calendar-grid"></div>
            <button class="btn-citas">Citas solicitadas</button>
        </section>
        <aside class="info-panel">
            <p>Hora de la cita: <span id="hora-cita">00:00</span></p>
            <p>Fecha de la cita: <span id="fecha-cita">00/00/00</span></p>
        </aside>
    </main>
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 Clínica Psicológica "Alma Libre". Todos los derechos reservados.</p>
            <p><a href="mailto:contacto@clinica.com">Contacto</a></p>
        </div>
    </footer>
    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Horas disponibles</h3>
            <ul id="time-options"></ul>
            <button class="close-modal" onclick="closeModal()">Cerrar</button>
        </div>
    </div>

    <script src="citas.js"></script>
</body>
</html>
