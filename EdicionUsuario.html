<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Perfil - Clínica Psicológica</title>
  <link rel="stylesheet" href="EdicionUsuario.css" />
</head>
<body>
  <header class="header">
    <h1>CLÍNICA PSICOLÓGICA</h1>
    <a href="MenuP.html"><button class="btn-cambiar">Regresar</button></a>
  </header>

  <main class="main-container">
    <h2>Editar Perfil</h2>
    <form id="form-editar-perfil">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" pattern="[0-9]{7,15}" title="Solo números, 7 a 15 dígitos" required />

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required />

      <label for="fecha-nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" required />

      <fieldset id="campos-psicologo" style="display:none;">
        <legend>Información Psicólogo</legend>

        <label for="especialidad">Especialidad:</label>
        <input type="text" id="especialidad" name="especialidad" />

        <label for="experiencia">Años de experiencia:</label>
        <input type="number" id="experiencia" name="experiencia" min="0" max="100" />
      </fieldset>

      <label for="password">Nueva contraseña:</label>
      <input type="password" id="password" name="password" minlength="6" placeholder="Dejar vacío para no cambiar" />

      <label for="confirm-password">Confirmar contraseña:</label>
      <input type="password" id="confirm-password" name="confirm-password" minlength="6" placeholder="Confirma la nueva contraseña" />

      <button type="submit" class="btn-aceptar">Guardar Cambios</button>
    </form>

    <p id="mensaje"></p>
  </main>

  <footer class="footer">
    <p>&copy; 2024 Clínica Psicológica "Alma Libre". Todos los derechos reservados.</p>
  </footer>

  <script src="EdicionUsuario.js"></script>
</body>
</html>
